sentence=Apply a sketch update from a local source, without a network connection.
paragraph=Stages an .ota update file produced by the build into the /ota: partition and asks the loader to install it on the next boot. The update bytes can come from any local source: a file already on the filesystem, a Serial stream, or a buffer held by the sketch.
