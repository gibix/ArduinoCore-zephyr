# MCUboot Kconfig for Portenta H7 (STM32H747 M7 core).
#
# Flash layout (internal, bank 1 only - 1 MB):
#   0x08000000   64K   boot_partition (MCUboot)
#   0x08010000  192K   scratch_partition
#   0x08040000  384K   slot0_partition (primary)
#   0x080A0000  384K   slot1_partition (secondary)
#
# Recovery: mcumgr/SMP over USB CDC-ACM (OTG-HS in FS mode).
# Entrance: RTC backup register magic (0xDF59) written by the loader on 1200bps.

# No secure boot - hash only.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Use the DT code partition for link address/size.
CONFIG_USE_DT_CODE_PARTITION=y

# Swap using scratch (STM32H7 has 128K erase sectors - not uniform enough for
# swap-using-move which needs uniform small sectors).
CONFIG_BOOT_SWAP_USING_SCRATCH=y

# Validate primary slot on every boot.
CONFIG_BOOT_VALIDATE_SLOT0=y

# --- Recovery: mcumgr/SMP over USB CDC-ACM ------------------------------------
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y

# STM32 has the legacy USB device stack driver (unlike PIC32CK).
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Portenta H7 bootloader"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x035b
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y

# CDC-ACM for the serial recovery transport.
CONFIG_USB_CDC_ACM=y
CONFIG_BOOT_SERIAL_CDC_ACM=y

# Buffers.
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=1024
CONFIG_BOOT_LINE_BUFS=16
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=64

# Direct image upload into the named slot.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y

# --- Entrance -----------------------------------------------------------------
# Use the RTC backup register magic value that the loader writes on 1200bps.
# Double-tap reset: noinit-RAM cookie detects two resets within the window.
# Also enters recovery via 1200-bps touch (loader arms the same cookie).
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_DOUBLE_RESET=y
CONFIG_BOOT_SERIAL_DOUBLE_RESET_WINDOW_MS=1000

# Enter recovery when no valid image exists.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y

# --- Indication ---------------------------------------------------------------
CONFIG_MCUBOOT_ACTION_HOOKS=n
CONFIG_MCUBOOT_INDICATION_LED=n

# --- Clock: run from HSI, skip PLL -------------------------------------------
# The PLL needs VOS0 which requires the PF1550 PMIC to be initialized over I2C,
# but I2C needs clocks — deadlock. A bootloader doesn't need 400MHz.
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=64000000

# Don't boot the M4 core from the bootloader.
CONFIG_STM32H7_BOOT_M4_AT_INIT=n

# --- Console (off) ------------------------------------------------------------
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# --- Stacks -------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=10240

# --- Performance --------------------------------------------------------------
CONFIG_ICACHE=y
CONFIG_DCACHE=y
