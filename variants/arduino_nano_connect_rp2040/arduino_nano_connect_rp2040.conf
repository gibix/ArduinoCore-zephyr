CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano RP2040 Connect"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x065E

CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Arduino Nano RP2040 Connect"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Arduino"
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_LLEXT_HEAP_SIZE=64

CONFIG_LLEXT_STORAGE_WRITABLE=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_ADC=y
CONFIG_DAC=n
CONFIG_PWM=y

# Filesystem for OTA
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# OTA
CONFIG_OTA=y

# Do NOT set CLOCK_CONTROL_RPI_PICO_SKIP_HW_INIT: after the SFU warm jump
# it leaves clock state inconsistent, hanging on the first context switch.
