CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano XL Link"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x007e
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
# Not for logging option despite the name: 1200 touch
CONFIG_UART_LINE_CTRL=y

CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_CRC=y

CONFIG_MAIN_STACK_SIZE=32768
CONFIG_LLEXT_HEAP_SIZE=64

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

CONFIG_FPU=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
# Ethernet and the ESP-AT WiFi interface each need an IPv4 configuration.
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_NET_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ETH_DRIVER=y

# KSZ8081 link-up overflows the default 1024 B system workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# Required by ETH_MCHP_GMAC_G1; without it the driver vanishes from the build.
CONFIG_NET_BUF_FIXED_DATA_SIZE=y

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96

CONFIG_POSIX_NETWORKING=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
# gettimeofday() for time(), used by sketch TLS libraries (e.g. ArduinoBearSSL).
CONFIG_XSI_SINGLE_PROCESS=y

# ESP8266 AT module (Connector carrier) on sercom1, brought up on first WiFi
# use; Ethernet stays the default interface.
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
CONFIG_WIFI_ESP_AT_VERSION_1_7=y
CONFIG_WIFI_ESP_AT_PASSIVE_MODE=y
# Module optional: started by the WiFi library, not at boot.
CONFIG_WIFI_ESP_AT_NET_IF_NO_AUTO_START=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# +IPD with the peer address, else UDP recvfrom() fails with ENOTSUP.
CONFIG_WIFI_ESP_AT_CIPDINFO_USE=y
# Name lookups use Zephyr's resolver (DNS_SERVER1 above); the ESP-AT driver
# does not offload DNS, it can only fetch the servers, and AT 1.7 lacks the
# AT+CIPDNS? command the driver sends for that.
CONFIG_WIFI_ESP_AT_DNS_USE=n

# Native TLS (Mbed TLS) over Ethernet and WiFi, used by ZephyrSSLClient.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Keep the TLS heap in the loader (default MBEDTLS_INIT=y), outside the
# sketch's 64 KiB data limit.
CONFIG_MBEDTLS_HEAP_SIZE=60000
# Allow server certificate chains without enlarging the outgoing buffer.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=7168
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
# TLS 1.2 with RSA or ECDSA server certificates; dependencies are selected
# by the ciphersuite options in Zephyr's Mbed TLS 4 integration.
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_POSIX_FD_MGMT=y
CONFIG_POSIX_DEVICE_IO=y
CONFIG_FILE_SYSTEM=y

CONFIG_ENTROPY_GENERATOR=y

CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_SPI_ASYNC=y
CONFIG_I2C_TARGET=y

# Avoid reset address at 0x08000000 - that is BFM, where the bootloader lives
CONFIG_ROMSTART_RELOCATION_ROM=n

# --- Booted by MCUboot (sysbuild, swap-using-offset, ECDSA-P256 signed) ---------
#
# The boot chain is MCUboot (BFM 0x08000000) -> this loader (slot0, PFM
# 0x0C000000). Sysbuild (sysbuild.conf in this directory) builds both and
# selects the upgrade mode and the signing key; BOOTLOADER_MCUBOOT shifts the
# link address by the image header.
CONFIG_BOOTLOADER_MCUBOOT=y

# The sketch is appended to this loader by zephyr-sketch-tool --squash and
# signed with it as one image; pad the loader so the sketch starts on an
# erase-block boundary.
CONFIG_LOADER_SKETCH_IN_MCUBOOT_IMAGE=y
CONFIG_LINKER_LAST_SECTION_ID=n
CONFIG_FLASH_ALIGN_BASED_ON_DT_ERASE_DIM=y

# 1200-bps touch: set the retention boot mode MCUboot turns into USB DFU.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# SET_CONFIGURATION allocates two 512-byte HS bulk buffers for CDC ACM, which
# exhausts the 1024 B default pool and leaves EP0 unable to allocate - the host
# then loops reset -> set address -> reset until it gives up. Same sizing as
# samples/cdc_acm_bridge, where it is likewise not optional.
CONFIG_UDC_BUF_POOL_SIZE=8192
# Loader DFU in 1 KB blocks (Zephyr's maximum): half the round trips of 512 B.
CONFIG_USBD_DFU_TRANSFER_SIZE=1024
CONFIG_USBD_THREAD_STACK_SIZE=4096

# Network OTA (libraries/OTA): stream into slot1 and run as a test; the sketch
# must call ota_confirm() within 60 s. With MCUboot's watchdog and a crash
# reset, a test image that fails is reverted.
CONFIG_OTA=y
CONFIG_RESET_ON_FATAL_ERROR=y

# 1200-bps touch -> loader DFU (same PID), double tap -> MCUboot DFU (0x017e).
CONFIG_LOADER_DFU_MODE=y
