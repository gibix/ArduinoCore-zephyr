SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Updates run as a test from slot1 and are reverted unless confirmed.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y

# Key from extra/build.sh --key (MCUboot's development key by default).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# MCUboot starts the watchdog, the loader feeds it. PIC32CK maximum is 16384 ms.
SB_CONFIG_ENFORCE_SECURE_WATCHDOG=y
SB_CONFIG_SECURE_WATCHDOG_TIMEOUT_MS=16000
