# USB identity of the carrier (bare module is 0x007e / "Arduino Nano XL Link").
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano XL Link Connector"
CONFIG_USB_DEVICE_PID=0x008e
CONFIG_LOADER_DFU_PID=0x017f

# ESP8266 AT module on sercom1 (shield overlay; AT version in its Kconfig.defconfig).
CONFIG_WIFI=y
CONFIG_WIFI_ESP_AT=y
CONFIG_WIFI_ESP_AT_PASSIVE_MODE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# +IPD with the peer address, else UDP recvfrom() fails with ENOTSUP.
CONFIG_WIFI_ESP_AT_CIPDINFO_USE=y
# Name lookups use Zephyr's resolver (DNS_SERVER1 from the base .conf); the
# ESP-AT driver does not offload DNS, it can only fetch the servers, and
# AT 1.7 lacks the AT+CIPDNS? command the driver sends for that.
CONFIG_WIFI_ESP_AT_DNS_USE=n
