#
# MCUboot of the OTA simulator: the Nano XL Link update policy
# (variants/arduino_nano_xl_link_*/mcuboot.conf on the boards that have it)
# without USB, on native_sim.

CONFIG_BOOT_SWAP_USING_OFFSET=y
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y

CONFIG_UPDATEABLE_IMAGE_NUMBER=1
CONFIG_BOOT_BOOTSTRAP=y
# boot_hooks.c: a pending permanent request overwrites slot0
CONFIG_BOOT_IMAGE_ACCESS_HOOKS=y

# mcuboot_sim_boot.c: print the decision and exit instead of jumping
CONFIG_BOOT_IMAGE_JUMP_HOOKS=y
CONFIG_MCUBOOT_ACTION_HOOKS=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y

CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y

# getentropy() of POSIX_C_LIB_EXT (Zephyr 4.5) needs the entropy device
CONFIG_ENTROPY_GENERATOR=y

# power_cut.c: numbered flash operations, cut through the simulator callbacks
CONFIG_FLASH_SIMULATOR_STATS=y
CONFIG_FLASH_SIMULATOR_CALLBACKS=y
