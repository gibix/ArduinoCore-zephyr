#
# Loader of the MCUboot OTA simulator (native_sim_ota in boards.txt): the
# Nano XL Link loader configuration without USB.

CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y

# libraries/OTA: stream into slot1, run as a test, ota_confirm() in time
CONFIG_OTA=y

# The watchdog MCUboot starts on the board (sysbuild ENFORCE_SECURE_WATCHDOG);
# here mcuboot_sim_loader.c starts it, the loader installs and feeds it.
CONFIG_WATCHDOG=y
CONFIG_WDT_COUNTER=y
CONFIG_COUNTER=y
CONFIG_APP_WATCHDOG_ENFORCED=y
CONFIG_APP_WATCHDOG_TIMEOUT_MS=16000

# Boot mode and MCUboot's bootloader info (bootloaderVersion())
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y
CONFIG_RETENTION_BOOTLOADER_INFO_OUTPUT_FUNCTION=y
